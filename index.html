.orb-b{width:520px;height:520px;background:radial-gradient(circle,#3B82F6 0%,transparent 70%);animation:float2 22s ease-in-out infinite}

 $('#nv').innerHTML=NAV.map(k=>`<li><a class="nav-link text-mist hover:text-paper py-1 transition-colors" href="#${k}">${t.nav[k]}</a></li>`).join('');
 $('#brand').innerHTML=esc(D.name.split(' ').slice(0,2).join(' '))+'<span class="text-light">.</span>';$('#hn').textContent=D.name;$('#hr').textContent=pick(D.role);$('#hw').textContent=pick(D.role).toLowerCase();$('#cp').textContent='© '+new Date().getFullYear()+' '+D.name;
 document.querySelectorAll('[data-k]').forEach(e=>{if(!e.firstChild)e.innerHTML=[...e.dataset.k].map((c,i)=>`<span style="transition-delay:${i*30}ms" aria-hidden="true">${c==' '?'&nbsp;':c}</span>`).join('')});
 const row=(s,i)=>`<div class="grid grid-cols-[44px_1fr_auto] gap-x-4 gap-y-2 items-center py-5 border-b border-edge"><span class="row-span-2 grid place-items-center size-11 border border-edge font-mono text-light">${esc(s.glyph||s.name.slice(0,2))}</span><b class="font-head font-medium text-xl">${esc(s.name)}</b><span class="mono"><span data-count="${s.progress}">0</span>%</span><div class="col-span-2 h-1 bg-raised overflow-hidden"><i class="tick block h-full bg-gradient-to-r from-electric to-light" style="--p:${s.progress/100};transition-delay:${i*120}ms"></i></div></div>`;
 $('#sk-done').innerHTML=D.skills.filter(s=>s.progress>=100).map(row).join('');$('#sk-exp').innerHTML=D.skills.filter(s=>s.progress<100).map(row).join('')||`<p class="py-5 text-mist">${t.now}</p>`;
 $('#certs').innerHTML=D.certs.map((c,i)=>`<button data-c="${i}" class="tilt snap-start shrink-0 w-[min(78vw,380px)] text-left bg-navy border border-edge hover:-translate-y-2 hover:border-light transition ${i%2?'mt-8 md:mt-16':''}"><div class="aspect-[1.42] bg-raised grid place-items-center overflow-hidden border-b border-edge img-wrap">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.title)}" loading="lazy" class="fade-img w-full h-full object-cover">`:`<div class="m-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] border border-edge grid place-items-center text-center"><span class="mono text-light">✓ ${esc(c.platform)}</span></div>`}</div><div class="p-5"><h3 class="text-xl tracking-tight">${esc(c.title)}</h3><p class="mono mt-1">${esc(c.platform)}${c.date?' · '+esc(c.date):''}</p></div></button>`).join('');
 $('#pj').innerHTML=D.projects.map((p,i)=>`<article class="rv grid md:grid-cols-12 gap-6 items-center mt-24"><div class="md:col-span-8 ${i%2?'md:col-start-5 md:row-start-1':''} aspect-[16/10] border border-edge bg-navy overflow-hidden glow img-wrap">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" class="fade-img w-full h-full object-cover hover:scale-105 transition duration-700">`:'<div class="w-full h-full grid grid-cols-[1fr_3fr] grid-rows-2 gap-3 p-6" aria-hidden="true"><i class="row-span-2 border border-edge bg-raised"></i><i class="border border-edge bg-electric/20"></i><i class="border border-edge bg-raised"></i></div>'}</div>
 <div class="md:col-span-4 ${i%2?'md:col-start-1 md:row-start-1':''}"><p class="mono">0${i+1} · ${esc(t.st[p.status]||p.status)}</p><h3 class="text-[clamp(1.7rem,3.2vw,2.8rem)] my-3">${esc(p.title)}</h3><p class="text-body mb-5">${esc(pick(p.desc))}</p><div class="flex flex-wrap gap-6 font-head font-medium">${p.live?`<a class="border-b border-electric hover:text-light transition-colors" target="_blank" rel="noopener" href="${esc(p.live)}">${t.live}</a>`:''}${p.repo?`<a class="border-b border-electric hover:text-light transition-colors" target="_blank" rel="noopener" href="${esc(p.repo)}">${t.repo}</a>`:''}<a class="border-b border-dashed border-dim hover:text-light transition-colors" href="#contact">${t.case_study}</a></div></div></article>`).join('');
 $('#tl').innerHTML=D.journey.map((j,i)=>`<li class="tl-item relative pl-11 pb-11 ml-0" data-tl style="transition-delay:${i*80}ms"><i class="tl-dot absolute -left-[5px] top-2 size-4 rounded-full border border-light ${j.done?'bg-light':'bg-ink hollow'}"></i><span class="mono text-light">${esc(j.date)}</span><h3 class="tl-title text-2xl tracking-tight mt-1">${esc(pick(j.title))}</h3><p class="text-body">${esc(pick(j.text))}</p></li>`).join('');
 const lk=D.links;$('#cl').innerHTML=[['Email','mailto:'+lk.email,lk.email],['GitHub',lk.github,lk.github?.replace('https://','')],['LinkedIn',lk.linkedin,lk.linkedin?.replace('https://www.','')],['Instagram',lk.instagram,lk.instagram?.replace('https://www.instagram.com/','@').replace(/\/$/,'')]].filter(l=>l[1]&&l[2]).map(([n,h,l])=>`<li><a href="${esc(h)}" ${n=='Email'?'':'target="_blank" rel="noopener"'} class="glow flex justify-between items-center py-6 border-b border-edge font-head text-2xl md:text-3xl hover:pl-5 hover:text-light transition-all">${n}<span class="mono">${esc(l)}</span></a></li>`).join('');
 document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
 document.querySelectorAll('.tl-item').forEach(e=>tlIO.observe(e));
 countUp();
 bindFadeImages();
}

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
const tlIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');tlIO.unobserve(e.target)}}),{threshold:.4});

$('#lg').onclick=()=>{L=L=='en'?'id':'en';localStorage.setItem('lang',L);view()};
$('#certs').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=D.certs[b.dataset.c];$('#dc').innerHTML=`<h3 class="text-2xl">${esc(c.title)}</h3><p class="mono mt-1">${esc(c.platform)} · ${esc(c.date)}</p>${c.image?`<img class="w-full my-4" src="${esc(c.image)}" alt="${esc(c.title)}">`:''}${c.link?`<a class="btn" target="_blank" rel="noopener" href="${esc(c.link)}">Verify</a>`:''}`;dlg.showModal()};
dlg.onclick=e=>{if(e.target===dlg)dlg.close()};

/* ---------- Loader ---------- */
const NAME='HILMI ROMZI NAGIB',steps=['> boot portfolio','> loading html · css','> loading javascript','> compiling interface','> ready.'];
function boot(){if(RM)return document.body.classList.add('on');const t0=performance.now();(function f(now){const p=Math.min(1,(now-t0)/2200);$('#cnt').textContent=String(Math.round(p*100)).padStart(2,'0');$('#bar').style.transform=`scaleX(${p})`;$('#sta').textContent=steps[Math.min(4,Math.floor(p*5))];
 $('#nm').textContent=[...NAME].map((c,i)=>c==' '||i<p*NAME.length*1.1?c:'#/%&@?$*+=~'[Math.random()*11|0]).join('');
 p<1?requestAnimationFrame(f):setTimeout(()=>{$('#pre').classList.add('done');document.body.classList.add('on')},450)})(t0)}

/* ---------- Custom cursor + trail ---------- */
function cursor(){if(RM||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
 const dot=$('.cursor-dot'),ring=$('.cursor-ring');let mx=0,my=0,rx=0,ry=0;
 const trails=[];const MAX=10;
 for(let i=0;i<MAX;i++){const t=document.createElement('div');t.className='cursor-trail';document.body.appendChild(t);trails.push({el:t,x:0,y:0})}
 addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`});
 (function tick(){rx+=(mx-rx)*.18;ry+=(my-ry)*.18;ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;
  let px=mx,py=my;trails.forEach((t,i)=>{t.x+=(px-t.x)*.35;t.y+=(py-t.y)*.35;t.el.style.transform=`translate(${t.x}px,${t.y}px) translate(-50%,-50%)`;t.el.style.opacity=(1-i/MAX)*.5;px=t.x;py=t.y});
  requestAnimationFrame(tick)})();
 const hov='a,button,input,[data-c]';
 document.addEventListener('mouseover',e=>{if(e.target.closest(hov))ring.classList.add('hover')});
 document.addEventListener('mouseout',e=>{if(e.target.closest(hov))ring.classList.remove('hover')});
}

/* ---------- Scroll progress + parallax orbs + hero parallax ---------- */
function scrollFX(){
 const bar=$('#progress'),hero=$('[data-parallax]');
 addEventListener('scroll',()=>{
  const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight);bar.style.transform=`scaleX(${p})`;
  if(hero){const y=h.scrollTop;hero.style.transform=`translateY(${y*.15}px)`;hero.style.opacity=Math.max(0,1-y/600)}
 },{passive:true});
 addEventListener('mousemove',e=>{const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
  $$('.orb').forEach((o,i)=>{o.style.marginLeft=(x*40*(i?-1:1))+'px';o.style.marginTop=(y*40*(i?-1:1))+'px'})},{passive:true});
}

/* ---------- Magnetic buttons ---------- */
function magnetic(){$$('.btn-magnetic').forEach(b=>{
  b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;b.style.transform=`translate(${x*.25}px,${y*.35}px)`;b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px')});
  b.addEventListener('mouseleave',()=>{b.style.transform=''})});
}

/* ---------- Glow follow ---------- */
function glowFollow(){$$('.glow').forEach(g=>{g.addEventListener('mousemove',e=>{const r=g.getBoundingClientRect();g.style.setProperty('--gx',(e.clientX-r.left)+'px');g.style.setProperty('--gy',(e.clientY-r.top)+'px')})});
}

/* ---------- Card tilt ---------- */
function tilt(){$$('.tilt').forEach(c=>{c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`});c.addEventListener('mouseleave',()=>c.style.transform='')})}
/* ---------- Magnetic tilt for project headings ---------- */
function projTilt(){$$('#pj article h3').forEach(h=>{h.addEventListener('mousemove',e=>{const r=h.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;h.style.transform=`skewX(${x*3}deg)`});h.addEventListener('mouseleave',()=>h.style.transform='')})}

/* ---------- Stat count up ---------- */
function countUp(){
 $$('[data-count]').forEach(el=>{
  const target=+el.dataset.count;let cur=0;
  const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/1500);cur=Math.round(target*p);el.textContent=cur;if(p<1)requestAnimationFrame(f)})(performance.now());io2.unobserve(el)}}),{threshold:.5});
  io2.observe(el);
 });
}

/* ---------- Journey timeline fill on scroll ---------- */
function journeyFill(){
 const sec=$('#journey'),fill=$('#tl-fill'),wrap=$('#tl-wrap');if(!sec||!fill)return;
 function upd(){const r=sec.getBoundingClientRect();const vh=innerHeight;const start=vh*.7;const end=-r.height+vh*.3;
  const p=Math.max(0,Math.min(1,(start-r.top)/(start-end)));fill.style.height=(p*100)+'%'}
 addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();
}

/* ---------- Image fade-in observer ---------- */
const imgIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');imgIO.unobserve(e.target)}}),{threshold:.1});
function bindFadeImages(){$$('.fade-img:not(.in)').forEach(im=>{if(im.complete&&im.naturalWidth>0)im.classList.add('in');else imgIO.observe(im)})}

/* ---------- Realtime toast ---------- */
let toastT=0;
function toast(msg,done){
 const t=$('#toast');$('#toast-msg').textContent=msg;
 t.classList.add('show');t.querySelector('.dot').style.display=done?'inline-block':'none';
 t.querySelector('.spin').style.display=done?'none':'inline-block';
 clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),done?3200:6000);
}

/* ---------- Data: Supabase (public read) + realtime updates ---------- */
let SB=null;
function initSB(){if(typeof supabase==='undefined'||SUPABASE_URL.includes('YOUR-'))return null;SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return SB}

// Cross-tab broadcast (works on same browser without any Supabase config)
const BC = typeof BroadcastChannel!=='undefined' ? new BroadcastChannel('portfolio-content') : null;
if(BC) BC.onmessage = ev=>{ if(ev.data?.type==='updated'){ reloadAndFlash(); } };

// Polling fallback (used if realtime doesn't connect within 3s)
let pollT=null, lastHash='';
function dataHash(){ return JSON.stringify(D).length+'|'+(D.certs?.length||0)+'|'+(D.projects?.length||0) }
function startPolling(){
  if(pollT) return;
  pollT = setInterval(async()=>{
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/content?id=eq.1&select=data`,{headers:SUPABASE_KEY.startsWith('sb_publishable')?{apikey:SUPABASE_KEY}:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
      const j=await r.json();
      if(j[0]?.data){
        const h=JSON.stringify(j[0].data).length;
        if(h!==lastHash){ lastHash=h; D={...D,...j[0].data}; view(); toast('Content updated ↻',true); }
      }
    }catch(e){}
  }, 8000);
}
function stopPolling(){ if(pollT){ clearInterval(pollT); pollT=null } }

async function reloadAndFlash(){
  toast('Updating…',false);
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/content?id=eq.1&select=data`,{headers:SUPABASE_KEY.startsWith('sb_publishable')?{apikey:SUPABASE_KEY}:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    const j=await r.json();
    if(j[0]?.data){ D={...D,...j[0].data}; view(); }
  }catch(e){ console.warn('reload failed',e) }
  toast('Content updated ↻',true);
  const s=$('#certificates');[s].forEach(el=>{if(el){el.classList.remove('flash-update');void el.offsetWidth;el.classList.add('flash-update')}});
}

async function load(){const sb=SB||initSB();if(!sb)return;
 try{const r=await fetch(`${SUPABASE_URL}/rest/v1/content?id=eq.1&select=data`,{headers:SUPABASE_KEY.startsWith('sb_publishable')?{apikey:SUPABASE_KEY}:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});const j=await r.json();if(j[0]?.data)D={...D,...j[0].data}; lastHash=JSON.stringify(D).length}catch(e){console.warn('Using default content',e)}
 // Subscribe to row changes on content table (UPDATE on id=1 → re-fetch & re-render)
 let rtOK=false;
 try{
  sb.channel('content-changes').on('postgres_changes',{event:'UPDATE',schema:'public',table:'content',filter:'id=eq.1'},payload=>{
   rtOK=true; // got at least one realtime event → keep using it
   reloadAndFlash();
  }).subscribe(status=>{
   if(status==='SUBSCRIBED'){ console.log('[realtime] connected') }
   else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){ console.warn('[realtime] failed, falling back to polling'); startPolling() }
  });
  // Safety net: if no realtime confirm after 4s, also start polling
  setTimeout(()=>{ if(!rtOK && SB?.getChannels?.()?.[0]?.state!=='joined'){ console.log('[realtime] no live events yet, enabling polling'); startPolling() } }, 4000);
 }catch(e){ console.warn('[realtime] init failed, using polling',e); startPolling() }
}

view();boot();initSB();load().then(()=>{view();setTimeout(()=>{cursor();scrollFX();magnetic();glowFollow();tilt();projTilt();journeyFill();bindFadeImages()},400)});
</script>
