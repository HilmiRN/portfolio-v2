<style type="text/tailwindcss">
@theme{--color-ink:#090D16;--color-navy:#111827;--color-raised:#151D2B;--color-paper:#F8FAFC;--color-mist:#94A3B8;--color-electric:#3B82F6;--color-light:#60A5FA;
--font-head:'Space Grotesk',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{@apply bg-ink text-paper font-body antialiased overflow-x-hidden}
h1,h2,h3{@apply font-head font-medium tracking-tighter leading-none}
.mono{@apply font-mono text-xs text-mist}
.wrap{@apply mx-auto max-w-[1240px] px-6 md:px-16}
.sec{@apply py-24 md:py-40 relative border-t border-slate-400/15}
.btn{@apply inline-flex items-center rounded-full border border-slate-400/20 px-6 py-3.5 font-head font-medium transition hover:border-light hover:bg-electric/15}
.k span{display:inline-block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.9,.2,1)}
.on .k span{transform:none}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
#pre{transition:transform 1s cubic-bezier(.77,0,.18,1)}#pre.done{transform:translateY(-100%)}
.tick{transform:scaleX(0);transform-origin:left;transition:transform 1.4s cubic-bezier(.2,.9,.2,1)}.in .tick{transform:scaleX(var(--p))}
.mq{animation:mq 30s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.k span,.rv{transform:none!important;opacity:1!important}#pre{display:none}}
</style>
</head>
<body>
<!-- loader -->
<div id="pre" class="fixed inset-0 z-50 bg-ink grid place-items-center p-8" aria-hidden="true">
  <div class="text-center"><p class="mono text-light">loading</p><p id="cnt" class="font-head text-[28vw] md:text-[14rem] leading-none">00</p><p id="nm" class="mono tracking-[.15em]"></p></div>

</div>

  </nav>

<main>

    <h1 class="mt-8 text-[clamp(2.9rem,10.5vw,9.5rem)]" aria-label="Quietly Building. Constantly Evolving.">
      <span class="k block overflow-hidden pb-[.1em]" data-k="Quietly Building."></span>
      <span class="k block overflow-hidden pb-[.1em] text-mist md:pl-24" data-k="Constantly Evolving."></span></h1>
    <div class="mt-12 grid gap-8 md:grid-cols-2 items-end">

    </div>

  </div>

<section id="about" class="sec"><div class="wrap grid md:grid-cols-12 gap-6">

</div></section>

<section id="stack" class="sec"><div class="wrap">

  <div><p class="mono mb-4" data-i="exp"></p><div id="sk-exp" class="border-t border-slate-400/15"></div><p class="mt-6 border border-slate-400/15 bg-navy p-5 text-mist" data-i="note"></p></div></div>
</div></section>

<section id="certificates" class="sec"><div class="wrap flex flex-wrap items-end gap-x-16 gap-y-6">

<section id="projects" class="sec"><div class="wrap">
  <p class="mono text-light absolute top-8" data-i="n4"></p><h2 class="text-[clamp(2.2rem,6vw,5rem)] rv" data-i="proj_h"></h2><div id="pj"></div></div></section>

<section id="journey" class="sec"><div class="wrap grid md:grid-cols-2 gap-16">
  <p class="mono text-light absolute top-8" data-i="n5"></p><h2 class="text-[clamp(2.2rem,6vw,5rem)] rv" data-i="jr_h"></h2><ol id="tl" class="relative"></ol></div></section>

<section id="contact" class="sec"><div class="wrap">
  <p class="mono text-light absolute top-8" data-i="n6"></p>
  <h2 class="text-[clamp(2.6rem,8.5vw,8rem)] max-w-[12ch] rv" data-i="ct_h"></h2>
  <p class="text-xl text-mist max-w-[46ch] my-8 rv" data-i="ct_p"></p><ul id="cl" class="border-t border-slate-400/15"></ul></div></section>
</main>

<footer class="border-t border-slate-400/15 py-8 overflow-hidden">
  <div class="mq flex w-max whitespace-nowrap font-head font-bold text-[clamp(3rem,11vw,9rem)] leading-none tracking-tighter text-transparent [-webkit-text-stroke:1px_var(--color-electric)]" aria-hidden="true"><span class="pr-[.5em]">Quietly building. Constantly evolving.</span><span class="pr-[.5em]">Quietly building. Constantly evolving.</span></div>
  <div class="wrap mono flex flex-wrap justify-between gap-4 mt-6"><span id="cp"></span><span data-i="foot"></span><span class="flex gap-5"><a href="#home" data-i="top"></a></span></div>
</footer>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=structuredClone(DEFAULT),L=localStorage.getItem('lang')||((navigator.language||'').startsWith('id')?'id':'en');
const T={en:{beyond:"Beyond the Code.",hello:"I’m an aspiring web developer exploring the intersection of creativity, technology, and digital experiences.",work:"Explore My Work",talk:"Let’s Connect",
about_h:"Behind Every Line of Code, There’s a Curious Mind.",portrait:"No portrait here on purpose. I’d rather you get to know me through how I think and what I build.",

ct_h:"Every Great Connection Starts Somewhere.",ct_p:"Have an interesting idea, a project, or simply want to talk about technology? I’d be happy to hear from you.",foot:"Designed & coded by hand.",top:"Back to top",

id:{beyond:"Lebih dari Sekadar Kode.",hello:"Aku calon web developer yang menjelajahi pertemuan antara kreativitas, teknologi, dan pengalaman digital.",work:"Lihat Karyaku",talk:"Mari Terhubung",
about_h:"Di Balik Setiap Baris Kode, Ada Pikiran yang Penasaran.",portrait:"Sengaja tanpa foto. Aku lebih suka kamu mengenalku lewat cara berpikir dan apa yang kubuat.",

const NAV=Object.keys(T.en.nav),pick=o=>o?.[L]??o?.en??'';
function view(){const t=T[L];document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(e=>{const k=e.dataset.i;const v=/^n\d$/.test(k)?'0'+k[1]+' / '+['about','stack','certificates','projects','journey','contact'][+k[1]-1]:t[k];if(v.includes('|')){const [a,b]=v.split('|');e.innerHTML=a+'<span class="block text-mist">'+b+'</span>'}else e.textContent=v});
 $('#lg').innerHTML=`<span class="${L=='en'?'text-light':''}">EN</span> <span class="${L=='id'?'text-light':''}">ID</span>`;
 $('#nv').innerHTML=NAV.map(k=>`<li><a class="text-mist hover:text-paper py-1" href="#${k}">${t.nav[k]}</a></li>`).join('');
 $('#brand').innerHTML=esc(D.name.split(' ').slice(0,2).join(' '))+'<span class="text-light">.</span>';$('#hn').textContent=D.name;$('#hr').textContent=pick(D.role);$('#hw').textContent=pick(D.role).toLowerCase();$('#cp').textContent='© '+new Date().getFullYear()+' '+D.name;
 document.querySelectorAll('[data-k]').forEach(e=>{if(!e.firstChild)e.innerHTML=[...e.dataset.k].map((c,i)=>`<span style="transition-delay:${i*30}ms" aria-hidden="true">${c==' '?'&nbsp;':c}</span>`).join('')});
 const row=(s,i)=>`<div class="grid grid-cols-[44px_1fr_auto] gap-x-4 gap-y-2 items-center py-5 border-b border-slate-400/15"><span class="row-span-2 grid place-items-center size-11 border border-slate-400/20 font-mono text-light">${esc(s.glyph||s.name.slice(0,2))}</span><b class="font-head font-medium text-xl">${esc(s.name)}</b><span class="mono">${s.progress>=100?t.st.Completed:s.progress+'%'}</span><div class="col-span-2 h-1 bg-raised overflow-hidden"><i class="tick block h-full bg-gradient-to-r from-electric to-light" style="--p:${s.progress/100};transition-delay:${i*120}ms"></i></div></div>`;
 $('#sk-done').innerHTML=D.skills.filter(s=>s.progress>=100).map(row).join('');$('#sk-exp').innerHTML=D.skills.filter(s=>s.progress<100).map(row).join('')||`<p class="py-5 text-mist">${t.now}</p>`;
 $('#certs').innerHTML=D.certs.map((c,i)=>`<button data-c="${i}" class="snap-start shrink-0 w-[min(78vw,380px)] text-left bg-navy border border-slate-400/20 hover:-translate-y-2 hover:border-light transition ${i%2?'mt-8 md:mt-16':''}"><div class="aspect-[1.42] bg-raised grid place-items-center overflow-hidden border-b border-slate-400/15">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.title)}" loading="lazy" class="w-full h-full object-cover">`:`<div class="m-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] border border-slate-400/20 grid place-items-center text-center"><span class="mono text-light">✓ ${esc(c.platform)}</span></div>`}</div><div class="p-5"><h3 class="text-xl tracking-tight">${esc(c.title)}</h3><p class="mono mt-1">${esc(c.platform)}${c.date?' · '+esc(c.date):''}</p></div></button>`).join('');
 $('#pj').innerHTML=D.projects.map((p,i)=>`<article class="rv grid md:grid-cols-12 gap-6 items-center mt-24"><div class="md:col-span-8 ${i%2?'md:col-start-5 md:row-start-1':''} aspect-[16/10] border border-slate-400/20 bg-navy overflow-hidden">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition duration-700">`:'<div class="w-full h-full grid grid-cols-[1fr_3fr] grid-rows-2 gap-3 p-6" aria-hidden="true"><i class="row-span-2 border border-slate-400/20 bg-raised"></i><i class="border border-slate-400/20 bg-electric/20"></i><i class="border border-slate-400/20 bg-raised"></i></div>'}</div>
 <div class="md:col-span-4 ${i%2?'md:col-start-1 md:row-start-1':''}"><p class="mono">0${i+1} · ${esc(t.st[p.status]||p.status)}</p><h3 class="text-[clamp(1.7rem,3.2vw,2.8rem)] my-3">${esc(p.title)}</h3><p class="text-mist mb-5">${esc(pick(p.desc))}</p><div class="flex gap-6 font-head font-medium">${p.live?`<a class="border-b border-electric hover:text-light" target="_blank" rel="noopener" href="${esc(p.live)}">${t.live}</a>`:''}${p.repo?`<a class="border-b border-electric hover:text-light" target="_blank" rel="noopener" href="${esc(p.repo)}">${t.repo}</a>`:''}</div></div></article>`).join('');
 $('#tl').innerHTML=D.journey.map(j=>`<li class="rv relative pl-11 pb-11 border-l border-slate-400/20 ml-2 ${j.done?'':'opacity-60'}"><i class="absolute -left-2 top-2 size-4 rounded-full border border-light ${j.done?'bg-light':'bg-ink'}"></i><span class="mono">${esc(j.date)}</span><h3 class="text-2xl tracking-tight mt-1">${esc(pick(j.title))}</h3><p class="text-mist">${esc(pick(j.text))}</p></li>`).join('');
 const lk=D.links;$('#cl').innerHTML=[['Email','mailto:'+lk.email,lk.email],['GitHub',lk.github,lk.github?.replace('https://','')],['LinkedIn',lk.linkedin,lk.linkedin?.replace('https://www.','')],['Instagram',lk.instagram,lk.instagram?.replace('https://www.instagram.com/','@').replace(/\/$/,'')]].filter(l=>l[1]&&l[2]).map(([n,h,l])=>`<li><a href="${esc(h)}" ${n=='Email'?'':'target="_blank" rel="noopener"'} class="flex justify-between items-center py-6 border-b border-slate-400/15 font-head text-2xl md:text-3xl hover:pl-5 hover:text-light transition-all">${n}<span class="mono">${esc(l)}</span></a></li>`).join('');
 document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e))}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});

 $('#nm').textContent=[...NAME].map((c,i)=>c==' '||i<p*NAME.length*1.1?c:'#/%&@?$*+=~'[Math.random()*11|0]).join('');
 p<1?requestAnimationFrame(f):setTimeout(()=>{$('#pre').classList.add('done');document.body.classList.add('on')},450)})(t0)}
// data: Supabase (public read) with local default as fallback
async function load(){try{if(SUPABASE_URL.includes('YOUR-'))return;const r=await fetch(`${SUPABASE_URL}/rest/v1/content?id=eq.1&select=data`,{headers:SUPABASE_KEY.startsWith('eyJ')?{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}:{apikey:SUPABASE_KEY}});const j=await r.json();if(j[0]?.data)D={...D,...j[0].data}}catch(e){console.warn('Using default content',e)}}
